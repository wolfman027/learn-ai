spring:
  application:
    name: alibaba-ai-mall-product
  datasource:
    url: jdbc:mysql://localhost:33060/mall_product?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

server:
  port: 8082

mybatis:
  type-aliases-package: com.wolfman.mall.product.entity
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
